name: Day Trading Options Bot Scanner

on:
  schedule:
    # Runs every 15 minutes during Wall Street hours (Mon-Fri 13:30 to 21:00 UTC)
    - cron: '*/15 13-21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-bot-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/python-stdlib@v2
        with:
          python-version: '3.10'

      - name: Run Intraday Day Trading Scan
        run: |
          python daytrade_options_bot.py

      - name: Commit & Push Updated State
        run: |
          git config --global user.name 'DayTradeBot[bot]'
          git config --global user.email 'daytradebot@users.noreply.github.com'
          git add daytrade_paper_state.json daytrade_bot.log
          git commit -m "Auto-update daytrade paper trading state [skip ci]" || exit 0
          git push
