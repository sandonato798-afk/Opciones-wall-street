# ==============================================================================
# SISTEMA DE OPCIONES D+ARQ — CONFIGURACIÓN GLOBAL Y PARÁMETROS DE CAPAS
# Unico archivo centralizado de parametros de trading (Fase 2)
# ==============================================================================

GLOBAL:
  TRADING_ENABLED: true           # Habilitado para operar en Paper Trading
  NAV_USD: 1000000.0              # Capital maestro ($1.000.000 USD)
  TIMEZONE: "America/New_York"
  MARKET_OPEN_EST: "09:30"
  MARKET_CLOSE_EST: "16:00"
  REINVESTMENT_THRESHOLD_USD: 500.0

  COLLATERAL_DISTRIBUTION:
    UNTOUCHABLE_HOLDINGS: true     # No se venden ni se operan opciones en contra
    AUTO_REINVEST_DIVIDENDS: true  # Reorganización y reinversión sistemática de dividendos
    
    TREASURY_BONDS_DIRECT:
      TOTAL_PCT: 0.60              # 60% en Bonos del Tesoro EE.UU. directos
      NUMBER_OF_BONDS: 6           # 6 bonos escalonados a 10% cada uno
      PCT_PER_BOND: 0.10           # 10% del capital por bono
      MAX_PRICE_PCT_OF_PAR: 99.9   # Precio estrictamente bajo la par (< 100)
      TARGET_YIELD_APY: 0.05       # Renta anual objetivo (~5.0% APY)
      MATURITY_LADDER_MONTH: 12    # Vencimientos en diciembre (12/2027, 12/2028, 12/2029, 12/2030, 12/2031, 12/2032)
      START_YEAR: 2027
    
    EQUITY_GOLD_POOL:
      VOO: 0.20                    # 20% Vanguard S&P 500 ETF
      QQQ: 0.15                    # 15% Invesco Nasdaq 100 ETF
      GLD: 0.05                    # 5% SPDR Gold Shares (Oro Fisico)

RISK_MANAGEMENT:
  MAX_DAILY_DRAWDOWN_PCT: 0.02    # 2% Max daily drawdown ($20,000 USD)
  MAX_CONCURRENT_TRADES: 10
  MAX_PORTFOLIO_DELTA: 0.35
  ORDER_TYPE: "LIMIT"             # NUNCA orden a mercado en opciones
  LIMIT_OFFSET_TICKS: 1           # Precio medio (Mid) +- 1 tick

CAPA_1_RUEDA:
  ENABLED: true
  ALLOCATED_CAPITAL_USD: 1000000.0
  UNIVERSE: ["SPY", "QQQ", "IWM"]
  TARGET_DELTA: 0.20              # Delta 0.20 (3-4% OTM)
  TARGET_DTE_MIN: 30
  TARGET_DTE_MAX: 45
  MONTHLY_PREMIUM_TARGET_PCT: 2.0
  CLOSE_PROFIT_PCT: 80.0          # Cierre anticipado al capturar 80% de la prima

CAPA_2_ALPHA:
  ENABLED: true
  ALLOCATED_CAPITAL_USD: 200000.0
  UNIVERSE: ["SPY", "QQQ"]        # Únicamente SPY y QQQ
  DMA_PERIOD: 200                 # SMA 200 días (Gráfico Diario)
  RSI_PERIOD_DAILY: 14            # RSI 14 (Gráfico Diario)
  RSI_DIP_THRESHOLD: 35.0         # RSI debe caer a <= 35.0
  RSI_REBOUND_POINTS: 5.0         # Entrada al rebotar +5.0 puntos sobre el mínimo
  SHORT_PUT_STRICT_MAX_OTM_PCT: 5.0 # Short Put strike <= spot * 1.05 (menor más cercano a +5%)
  MIN_CONTRACTS_PER_TRADE: 2      # Mínimo 2 contratos por pata (1:1 paridad)
  MAX_CONTRACTS_PER_TRADE: 4      # Máximo 4 contratos por pata (1:1 paridad)
  NET_CREDIT_MIN_USD: 0.0         # Prima Put >= Prima Call (Crédito Neto >= 0)
  USE_FURTHEST_DTE: true          # Máximo vencimiento LEAPS disponible
  DECOUPLING_PUT_RATIO: 0.50      # Recompra Puts cuando Prima Put <= 50% Prima Call
  DECOUPLING_SELL_CALLS_PCT: 50.0 # Vender el 50% de Calls en simultáneo (Combo BAG)
  MAX_POSITIONS_PER_SYMBOL: 2

CAPA_3_RSI:
  ENABLED: false                  # Pausado para evaluación enfocada en Capas 1, 2 y 4
  ALLOCATED_CAPITAL_USD: 150000.0
  UNIVERSE: ["SPY", "QQQ", "DIA"]
  RSI_PERIOD: 14                  # Wilder RSI 14 real sobre velas de 5 min / intradía
  RSI_ENTRY_THRESHOLD: 25.0       # RSI < 25 (Pánico de sobreventa)
  TARGET_DTE_MAX: 1
  TAKE_PROFIT_PCT: 50.0
  TIME_STOP_EST: "15:55"

CAPA_4_DAYTRADE:
  ENABLED: true                   # Habilitado para evaluación en Paper Trading
  ALLOCATED_CAPITAL_USD: 150000.0
  UNIVERSE: ["SPY", "QQQ"]
  TARGET_DTE: 1
  ROLL_DEFENSIVO_EST: "15:55"
  ROLL_OUT_DTE: 30
  MAX_PORTFOLIO_MARGIN_LEVERAGE: 1.5

CAPA_5_BULLMARKET:
  ENABLED: false                  # Pausado para evaluación enfocada en Capas 1, 2 y 4
  ALLOCATED_CAPITAL_USD: 150000.0
  UNIVERSE: ["SPY", "QQQ", "GLD", "IWM", "TLT"]
  LONG_LEAPS_DELTA_MIN: 0.75
  LONG_LEAPS_DELTA_MAX: 0.80
  LONG_LEAPS_DTE_MIN: 60
  SHORT_CALL_DELTA_MAX: 0.25
  SHORT_CALL_DTE_MIN: 7
  SHORT_CALL_DTE_MAX: 14
  SHORT_CALL_TAKE_PROFIT_PCT: 80.0
  ROLL_TRIGGER_DTE: 2
